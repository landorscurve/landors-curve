<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Assessment - Landor's Curve</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root {
  --gold: #F0A500;
  --dark: #050505;
  --panel: #111118;
  --panel2: #16161F;
  --border: rgba(240,165,0,0.15);
  --text: #E8E8F0;
  --muted: #888899;
  --red: #FF4757;
  --orange: #FF6B35;
  --yellow: #FFD32A;
  --green: #2ED573;
  --blue: #1E90FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #050505; color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
body::before { display: none; }
.container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 48px 28px 80px; }
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,15,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
  margin-bottom: 0;
}
.nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 2px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
.nav-links { display: flex; gap: 2px; }
.nav-links a { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 4px; transition: all 0.2s; border: none; }
.nav-links a:hover { color: var(--gold); background: rgba(240,165,0,0.08); }
@media (max-width: 720px) { .nav-links { display: none; } }
.title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px,10vw,88px); line-height: 0.88; color: var(--text); letter-spacing: 2px; margin-bottom: 18px; }
.title span { color: var(--gold); }
.subtitle { font-size: 14px; color: var(--muted); font-weight: 300; line-height: 1.7; max-width: 580px; margin-bottom: 36px; }
.curve-wrap { margin-bottom: 40px; }
.curve-wrap svg { width: 100%; height: 70px; overflow: visible; }

/* RESUME ZONE */
.resume-zone {
  border: 1.5px dashed rgba(240,165,0,0.35);
  border-radius: 14px;
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 16px;
  transition: all 0.2s;
  background: rgba(240,165,0,0.02);
  cursor: pointer;
  display: block;
}
.resume-zone:hover, .resume-zone.drag-over { border-color: var(--gold); background: rgba(240,165,0,0.06); }
.resume-zone-icon { font-size: 28px; margin-bottom: 10px; }
.resume-zone-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 1px; margin-bottom: 8px; }
.resume-zone-sub { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
.resume-zone-btn { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 8px 20px; border-radius: 6px; border: 1px solid rgba(240,165,0,0.4); color: var(--gold); background: transparent; display: inline-block; }
.resume-privacy { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px; color: var(--muted); opacity: 0.5; margin-top: 12px; }
input[type="file"]#resumeFile { display: none; }

.resume-processing { display: none; align-items: center; gap: 12px; background: rgba(240,165,0,0.06); border: 1px solid rgba(240,165,0,0.2); border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
.resume-processing.show { display: flex; }
.resume-spin { width: 20px; height: 20px; border: 2px solid rgba(240,165,0,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0; }
.resume-processing-text { font-size: 13px; color: var(--gold); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; }
.resume-status { display: none; align-items: center; gap: 12px; border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
.resume-status.show { display: flex; }
.resume-status-ok { background: rgba(46,213,115,0.08); border: 1px solid rgba(46,213,115,0.25); }
.resume-status-warn { background: rgba(255,211,42,0.08); border: 1px solid rgba(255,211,42,0.25); }
.resume-status-icon { font-size: 20px; }
.resume-status-title { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; margin-bottom: 2px; }
.resume-status-ok .resume-status-title { color: var(--green); }
.resume-status-warn .resume-status-title { color: var(--yellow); }
.resume-status-sub { font-size: 12px; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 16px; }
.card-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
.skill-entry { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.skill-entry-top { display: grid; grid-template-columns: 1fr 80px 36px; gap: 10px; align-items: center; margin-bottom: 14px; }
.skill-input { background: #050505; border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); width: 100%; outline: none; transition: border-color 0.2s; }
.skill-input:focus { border-color: var(--gold); }
.skill-input::placeholder { color: var(--muted); }
.years-input { background: #050505; border: 1px solid var(--border); border-radius: 8px; padding: 11px 10px; font-family: 'DM Mono', monospace; font-size: 14px; color: var(--gold); width: 100%; outline: none; text-align: center; }
.years-input:focus { border-color: var(--gold); }
.remove-btn { background: rgba(255,71,87,0.06); border: 1px solid rgba(255,71,87,0.2); border-radius: 6px; color: var(--red); width: 36px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.remove-btn:hover { background: rgba(255,71,87,0.2); }
.skill-entry-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 580px) { .skill-entry-body { grid-template-columns: 1fr; } }
.field-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.days-row { display: flex; gap: 4px; flex-wrap: wrap; }
.day-btn { padding: 6px 9px; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--muted); background: #050505; transition: all 0.15s; }
.day-btn.active { background: rgba(240,165,0,0.12); border-color: var(--gold); color: var(--gold); }
.hours-row { display: flex; align-items: center; gap: 10px; }
.hrs-slider { flex: 1; accent-color: var(--gold); }
.hrs-display { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); white-space: nowrap; min-width: 90px; text-align: right; }
.hours-badge { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 9px 14px; background: rgba(240,165,0,0.05); border-radius: 6px; border: 1px solid rgba(240,165,0,0.12); }
.hours-badge-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
.hours-badge-val { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); }
.hours-badge-level { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; padding: 3px 8px; border-radius: 4px; }
.level-master { background: rgba(240,165,0,0.15); color: var(--gold); }
.level-advanced { background: rgba(255,107,53,0.15); color: var(--orange); }
.level-proficient { background: rgba(255,211,42,0.12); color: var(--yellow); }
.level-competent { background: rgba(46,213,115,0.12); color: var(--green); }
.level-foundation { background: rgba(136,136,153,0.12); color: var(--muted); }
.level-exposure { background: rgba(136,136,153,0.08); color: var(--muted); }
.add-btn { background: none; border: 1px dashed rgba(240,165,0,0.3); border-radius: 8px; color: var(--gold); padding: 12px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 4px; transition: all 0.2s; }
.add-btn:hover { background: rgba(240,165,0,0.06); border-color: var(--gold); }
.tip-box { background: rgba(240,165,0,0.04); border: 1px solid rgba(240,165,0,0.12); border-left: 3px solid rgba(240,165,0,0.4); border-radius: 0 10px 10px 0; padding: 14px 18px; margin-top: 16px; }
.tip-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.tip-text { font-size: 12px; color: var(--muted); line-height: 1.65; }
.tip-text strong { color: var(--text); }
.analyze-btn { background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 16px 40px; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; cursor: pointer; width: 100%; margin-top: 8px; transition: background 0.2s, transform 0.1s; }
.analyze-btn:hover { background: #FFB800; }
.analyze-btn:active { transform: scale(0.99); }
.analyze-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
.loading-box { display: none; text-align: center; padding: 64px 20px; }
.loading-box.show { display: block; }
.spin-wrap { display: inline-block; position: relative; width: 56px; height: 56px; margin-bottom: 22px; }
.spin-wrap::before { content: ''; position: absolute; inset: 0; border: 2px solid rgba(240,165,0,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.75s linear infinite; }
.spin-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; }
.loading-sub { font-size: 12px; color: var(--muted); }
.error-box { display: none; background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.25); border-radius: 10px; padding: 16px 20px; color: #FF7785; font-size: 13px; margin-bottom: 20px; }
.error-box.show { display: block; }
.results-box { display: none; }
.results-box.show { display: block; }
.divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
.section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
.profile-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; margin-bottom: 16px; }
.profile-text { font-size: 14px; color: var(--text); line-height: 1.75; font-weight: 300; margin-bottom: 16px; }
.skill-levels { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.skill-pill { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 8px; }
.rarity-row { display: flex; align-items: center; gap: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.rarity-score { font-family: 'Bebas Neue', sans-serif; font-size: 52px; color: var(--gold); line-height: 1; }
.rarity-info { flex: 1; }
.rarity-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.rarity-desc { font-size: 13px; color: var(--text); line-height: 1.5; }
.rarity-track { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.rarity-fill { height: 100%; border-radius: 3px; background: var(--gold); transition: width 1.3s cubic-bezier(0.16,1,0.3,1); width: 0%; }
.strength-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; margin-bottom: 16px; }
.sbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sbar:last-child { margin-bottom: 0; }
.sbar-lbl { font-size: 12px; color: var(--muted); width: 140px; flex-shrink: 0; }
.sbar-track { flex: 1; height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.sbar-fill { height: 100%; border-radius: 3px; transition: width 1.4s cubic-bezier(0.16,1,0.3,1); width: 0%; }
.sbar-val { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); width: 34px; text-align: right; }
.timeline-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 16px; }
@media (max-width: 600px) { .timeline-grid { grid-template-columns: 1fr; } }
.tl-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
.tl-period { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.tl-short { color: var(--green); }
.tl-medium { color: var(--yellow); }
.tl-long { color: var(--orange); }
.tl-job { margin-bottom: 10px; padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; }
.tl-job-title { font-size: 13px; color: var(--text); font-weight: 500; margin-bottom: 4px; }
.tl-job-reason { font-size: 11px; color: var(--muted); line-height: 1.4; }
.insight-card { background: var(--panel); border-left: 4px solid var(--gold); border-radius: 0 14px 14px 0; padding: 20px 24px; margin-bottom: 16px; }
.insight-text { font-size: 14px; color: var(--text); line-height: 1.75; font-weight: 300; }
.next-card { background: rgba(46,213,115,0.06); border: 1px solid rgba(46,213,115,0.2); border-radius: 12px; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.next-text { font-size: 13px; color: var(--text); line-height: 1.6; }
.next-text strong { color: var(--green); }
.next-btn { background: var(--green); color: #000; border: none; border-radius: 8px; padding: 11px 22px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; text-decoration: none; display: inline-block; }
.footer { margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); line-height: 1.7; font-family: 'DM Mono', monospace; }

/* NAV */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,15,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
}
.nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 2px; text-decoration: none; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.nav-logo img { width: 22px; height: 22px; border-radius: 4px; }
.nav-links { display: flex; align-items: center; gap: 2px; }
.nav-links a { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 4px; transition: all 0.2s; white-space: nowrap; }
.nav-links a:hover { color: var(--gold); background: rgba(240,165,0,0.08); }
.nav-links a.active { color: var(--gold); }
.nav-dropdown { position: relative; }
.nav-dropdown-btn { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: all 0.2s; display: flex; align-items: center; gap: 4px; }
.nav-dropdown-btn:hover { color: var(--gold); background: rgba(240,165,0,0.08); }
.nav-dropdown-btn svg { width: 10px; height: 10px; transition: transform 0.2s; }
.nav-dropdown.open .nav-dropdown-btn svg { transform: rotate(180deg); }
.nav-dropdown.open .nav-dropdown-btn { color: var(--gold); }
.nav-dropdown-menu { display: none; position: absolute; top: calc(100% + 8px); left: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; min-width: 180px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4); z-index: 200; }
.nav-dropdown.open .nav-dropdown-menu { display: block; }
.nav-dropdown-menu a { display: block; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 12px 16px; transition: all 0.15s; border-bottom: 1px solid var(--border); }
.nav-dropdown-menu a:last-child { border-bottom: none; }
.nav-dropdown-menu a:hover { color: var(--gold); background: rgba(240,165,0,0.06); }
.nav-hamburger { display: none; background: none; border: none; cursor: pointer; padding: 6px; color: var(--gold); align-items: center; }
.nav-hamburger svg { width: 22px; height: 22px; }
.mobile-menu { display: none; position: fixed; inset: 0; z-index: 999; }
.mobile-menu.open { display: block; }
.mobile-menu-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.65); }
.mobile-menu-panel { position: absolute; top: 0; right: 0; width: 280px; height: 100%; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 0; overflow-y: auto; }
.mobile-menu-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.mobile-menu-logo { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); letter-spacing: 2px; text-decoration: none; }
.mobile-menu-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 24px; line-height: 1; padding: 0; }
.mobile-menu-close:hover { color: var(--gold); }
.mobile-menu a { display: block; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 14px 20px; border-bottom: 1px solid rgba(240,165,0,0.06); transition: all 0.15s; }
.mobile-menu a:hover { color: var(--gold); background: rgba(240,165,0,0.06); }
.mobile-menu-section { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); opacity: 0.4; padding: 12px 20px 4px; }
.mobile-menu a.sub { padding-left: 32px; font-size: 10px; }
@media (max-width: 720px) { .nav-links { display: none; } .nav-hamburger { display: flex; } }

.mobile-menu-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;text-decoration:none;}
.mobile-menu-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:0;}
.mobile-menu-close:hover{color:var(--gold);}
.mobile-menu a{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:14px 20px;border-bottom:1px solid rgba(240,165,0,0.06);transition:all 0.15s;}
.mobile-menu a:hover{color:var(--gold);background:rgba(240,165,0,0.06);}
.mobile-menu-section{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0.45;padding:12px 20px 4px;}
.mobile-menu a.sub{padding-left:32px;font-size:10px;}
@media(max-width:720px){.nav-links{display:none;}.nav-hamburger{display:flex;}}

/* PAGE DISCLAIMER */
.page-disclaimer { border-top: 1px solid rgba(240,165,0,0.1); margin-top: 48px; padding: 20px 28px 28px; }
.page-disclaimer-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-disclaimer-text { font-family: 'DM Mono', monospace; font-size: 10px; color: #555566; line-height: 1.7; letter-spacing: 0.5px; flex: 1; min-width: 200px; }
.page-disclaimer-link { font-family: 'DM Mono', monospace; font-size: 10px; color: #F0A500; text-decoration: none; white-space: nowrap; letter-spacing: 0.5px; flex-shrink: 0; }
.page-disclaimer-link:hover { text-decoration: underline; }
@media (max-width: 520px) { .page-disclaimer-inner { flex-direction: column; gap: 8px; } }
@media print { .page-disclaimer { text-align: center; border-top: 1px solid #ccc; padding: 12px 0; } .page-disclaimer-inner { justify-content: center; flex-direction: column; gap: 4px; } }
