<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico?v=2">
<title>Safe Careers List — Landor's Curve</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F0A500;--dark:#050505;--panel:#0f0f0f;--panel2:#161616;
  --border:rgba(240,165,0,0.12);--text:#E8E8F0;--muted:#888899;
  --red:#FF4757;--orange:#FF6B35;--yellow:#FFD32A;--green:#2ED573;--blue:#1E90FF;--purple:#A855F7;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(5,5,5,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;text-decoration:none;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-logo img{width:22px;height:22px;border-radius:4px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:4px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown{position:relative;}
.nav-dropdown-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:4px;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.nav-dropdown-btn:hover,.nav-dropdown.open .nav-dropdown-btn{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown-btn svg{width:10px;height:10px;transition:transform 0.2s;}
.nav-dropdown.open .nav-dropdown-btn svg{transform:rotate(180deg);}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:190px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200;}
.nav-dropdown.open .nav-dropdown-menu{display:block;}
.nav-dropdown-menu a{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 16px;transition:all 0.15s;border-bottom:1px solid var(--border);}
.nav-dropdown-menu a:last-child{border-bottom:none;}
.nav-dropdown-menu a:hover{color:var(--gold);background:rgba(240,165,0,0.06);}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--gold);align-items:center;}
.nav-hamburger svg{width:22px;height:22px;}
.mobile-menu{display:none;position:fixed;inset:0;z-index:999;}
.mobile-menu.open{display:block;}
.mobile-menu-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);}
.mobile-menu-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.mobile-menu-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.mobile-menu-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;text-decoration:none;}
.mobile-menu-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:0;}
.mobile-menu-close:hover{color:var(--gold);}
.mobile-menu a{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:14px 20px;border-bottom:1px solid rgba(240,165,0,0.06);transition:all 0.15s;}
.mobile-menu a:hover{color:var(--gold);}
.mobile-menu-section{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0.4;padding:12px 20px 4px;}
.mobile-menu a.sub{padding-left:32px;font-size:10px;}
@media(max-width:720px){.nav-links{display:none;}.nav-hamburger{display:flex;}}

/* LAYOUT */
.wrap{max-width:1040px;margin:0 auto;padding:0 28px;}
.section{padding:64px 0;}

/* HERO */
.hero{padding:64px 0 40px;}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--green);text-transform:uppercase;margin-bottom:16px;opacity:0.8;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,8vw,80px);line-height:0.9;color:var(--text);letter-spacing:2px;margin-bottom:14px;}
.hero-title span{color:var(--green);}
.hero-sub{font-size:15px;color:var(--muted);line-height:1.75;max-width:640px;margin-bottom:10px;}
.hero-note{font-size:12px;color:var(--muted);opacity:0.6;line-height:1.7;max-width:600px;font-style:italic;padding:12px 16px;border-left:2px solid rgba(240,165,0,0.2);margin-top:16px;}

/* SEARCH + FILTER */
.search-filter-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:20px;}
.search-row{display:flex;gap:10px;margin-bottom:18px;}
.search-inp{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 18px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color 0.2s;}
.search-inp:focus{border-color:var(--gold);}
.search-inp::placeholder{color:var(--muted);}
.sort-sel{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 14px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);outline:none;cursor:pointer;transition:border-color 0.2s;}
.sort-sel:focus{border-color:var(--gold);}

/* TABS */
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;border-radius:6px;cursor:pointer;border:1px solid;transition:all 0.18s;background:transparent;}
.tab-all{color:var(--gold);border-color:rgba(240,165,0,0.3);}
.tab-all.active,.tab-all:hover{background:rgba(240,165,0,0.12);border-color:var(--gold);color:var(--gold);}
.tab-green{color:var(--green);border-color:rgba(46,213,115,0.25);}
.tab-green.active,.tab-green:hover{background:rgba(46,213,115,0.1);border-color:var(--green);}
.tab-yellow{color:var(--yellow);border-color:rgba(255,211,42,0.25);}
.tab-yellow.active,.tab-yellow:hover{background:rgba(255,211,42,0.1);border-color:var(--yellow);}
.tab-orange{color:var(--orange);border-color:rgba(255,107,53,0.25);}
.tab-orange.active,.tab-orange:hover{background:rgba(255,107,53,0.1);border-color:var(--orange);}
.tab-blue{color:var(--blue);border-color:rgba(30,144,255,0.25);}
.tab-blue.active,.tab-blue:hover{background:rgba(30,144,255,0.1);border-color:var(--blue);}
.tab-red{color:var(--red);border-color:rgba(255,71,87,0.25);}
.tab-red.active,.tab-red:hover{background:rgba(255,71,87,0.1);border-color:var(--red);}
.tab-purple{color:var(--purple);border-color:rgba(168,85,247,0.25);}
.tab-purple.active,.tab-purple:hover{background:rgba(168,85,247,0.1);border-color:var(--purple);}

/* RESULTS META */
.results-meta{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.cards-grid{grid-template-columns:1fr;}}

/* CAREER CARD */
.career-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;transition:border-color 0.18s;display:flex;flex-direction:column;}
.career-card:hover{border-color:rgba(240,165,0,0.3);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.card-name{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text);letter-spacing:1px;line-height:1;}
.card-score-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.card-score{font-family:'Bebas Neue',sans-serif;font-size:22px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid;flex-shrink:0;}
.score-green{color:var(--green);border-color:rgba(46,213,115,0.4);background:rgba(46,213,115,0.06);}
.score-yellow{color:var(--yellow);border-color:rgba(255,211,42,0.4);background:rgba(255,211,42,0.06);}
.score-orange{color:var(--orange);border-color:rgba(255,107,53,0.4);background:rgba(255,107,53,0.06);}
.score-red{color:var(--red);border-color:rgba(255,71,87,0.4);background:rgba(255,71,87,0.06);}
.score-blue{color:var(--blue);border-color:rgba(30,144,255,0.4);background:rgba(30,144,255,0.06);}
.score-purple{color:var(--purple);border-color:rgba(168,85,247,0.4);background:rgba(168,85,247,0.06);}
.score-gray{color:var(--muted);border-color:rgba(136,136,153,0.3);background:rgba(136,136,153,0.05);}
.card-badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:8px;}
.badge-green{background:rgba(46,213,115,0.1);color:var(--green);border:1px solid rgba(46,213,115,0.2);}
.badge-yellow{background:rgba(255,211,42,0.1);color:var(--yellow);border:1px solid rgba(255,211,42,0.2);}
.badge-orange{background:rgba(255,107,53,0.1);color:var(--orange);border:1px solid rgba(255,107,53,0.2);}
.badge-red{background:rgba(255,71,87,0.1);color:var(--red);border:1px solid rgba(255,71,87,0.2);}
.badge-blue{background:rgba(30,144,255,0.1);color:var(--blue);border:1px solid rgba(30,144,255,0.2);}
.badge-purple{background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.2);}
.badge-gray{background:rgba(136,136,153,0.1);color:var(--muted);border:1px solid rgba(136,136,153,0.2);}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;flex:1;}
.card-expand-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer;transition:all 0.15s;align-self:flex-start;}
.card-expand-btn:hover{color:var(--gold);border-color:rgba(240,165,0,0.3);}
.card-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.card-detail.open{display:block;}
.detail-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;margin-top:10px;}
.detail-label:first-child{margin-top:0;}
.detail-label-risk{color:var(--orange);}
.detail-label-boost{color:var(--green);}
.detail-text{font-size:11px;color:var(--muted);line-height:1.65;}

/* SKILLS TAB */
.skills-section{padding:40px 0;}
.skills-intro{font-size:13px;color:var(--muted);line-height:1.7;max-width:600px;margin-bottom:28px;}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.skill-group-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;}
.skill-group-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:1px;margin-bottom:12px;}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px;}
.skill-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--text);background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:4px 10px;}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;padding:32px 0 56px;}
.page-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:9px 18px;border-radius:6px;border:1px solid var(--border);color:var(--muted);background:var(--panel);cursor:pointer;transition:all 0.2s;}
.page-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.page-btn:disabled{opacity:0.25;cursor:not-allowed;}
.page-info{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;}

/* CATEGORY LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
.legend-item{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);}
.legend-dot{width:8px;height:8px;border-radius:50%;}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:28px 40px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-top:40px;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:2px;}
.footer-copy{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);opacity:0.4;}
.footer-links{display:flex;gap:16px;flex-wrap:wrap;}
.footer-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);text-decoration:none;text-transform:uppercase;}
.footer-links a:hover{color:var(--gold);}
.footer-related-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);opacity:0.45;margin-bottom:6px;}
.no-results{text-align:center;padding:60px 20px;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;}
</style>
</head>
