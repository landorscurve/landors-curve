<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico?v=2">
<title>Roadmap - Landor's Curve</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--gold:#F0A500;--dark:#050505;--panel:#0f0f0f;--panel2:#161616;--border:rgba(240,165,0,0.12);--text:#E8E8F0;--muted:#888899;--red:#FF4757;--orange:#FF6B35;--yellow:#FFD32A;--green:#2ED573;--blue:#1E90FF;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.nav{position:sticky;top:0;z-index:100;background:rgba(5,5,5,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;text-decoration:none;display:flex;align-items:center;gap:8px;}
.nav-logo img{width:22px;height:22px;border-radius:4px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:4px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown{position:relative;}
.nav-dropdown-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:4px;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.nav-dropdown-btn:hover,.nav-dropdown.open .nav-dropdown-btn{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown-btn svg{width:10px;height:10px;transition:transform 0.2s;}
.nav-dropdown.open .nav-dropdown-btn svg{transform:rotate(180deg);}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:200px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200;}
.nav-dropdown.open .nav-dropdown-menu{display:block;}
.nav-dropdown-menu a{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 16px;transition:all 0.15s;border-bottom:1px solid var(--border);}
.nav-dropdown-menu a:last-child{border-bottom:none;}
.nav-dropdown-menu a:hover{color:var(--gold);background:rgba(240,165,0,0.06);}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--gold);align-items:center;}
.nav-hamburger svg{width:22px;height:22px;}
.mobile-menu{display:none;position:fixed;inset:0;z-index:999;}
.mobile-menu.open{display:block;}
.mobile-menu-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);}
.mobile-menu-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.mobile-menu-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.mobile-menu-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;text-decoration:none;}
.mobile-menu-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:0;}
.mobile-menu a{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:14px 20px;border-bottom:1px solid rgba(240,165,0,0.06);transition:all 0.15s;}
.mobile-menu a:hover{color:var(--gold);}
.mobile-menu-section{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0.4;padding:12px 20px 4px;}
.mobile-menu a.sub{padding-left:32px;font-size:10px;}
@media(max-width:720px){.nav-links{display:none;}.nav-hamburger{display:flex;}}
.wrap{max-width:960px;margin:0 auto;padding:0 28px;}
.divider-line{border:none;border-top:1px solid var(--border);margin:40px 0;}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:16px;opacity:0.8;}
.hero{padding:64px 0 40px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,8vw,76px);line-height:0.9;color:var(--text);letter-spacing:2px;margin-bottom:8px;}
.hero-title span{color:var(--gold);}
.hero-subtitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,2.5vw,22px);color:var(--muted);letter-spacing:1px;margin-bottom:18px;}
.hero-body{font-size:15px;color:var(--text);line-height:1.8;max-width:640px;margin-bottom:10px;font-weight:300;}
.hero-note{font-size:13px;color:var(--muted);line-height:1.75;max-width:620px;padding:14px 18px;border-left:3px solid rgba(240,165,0,0.3);background:rgba(240,165,0,0.03);border-radius:0 8px 8px 0;margin-top:16px;}

/* MODE SELECTOR */
.mode-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 30px;margin-bottom:16px;}
.mode-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{background:var(--dark);border:2px solid var(--border);border-radius:10px;padding:18px 20px;cursor:pointer;transition:all 0.2s;}
.mode-card:hover{border-color:rgba(240,165,0,0.35);}
.mode-card.selected-cm{border-color:var(--green);background:rgba(46,213,115,0.05);}
.mode-card.selected-lp{border-color:var(--gold);background:rgba(240,165,0,0.05);}
.mode-card-icon{font-size:22px;margin-bottom:8px;}
.mode-card-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:6px;}
.mode-cm .mode-card-title{color:var(--green);}
.mode-lp .mode-card-title{color:var(--gold);}
.mode-card-desc{font-size:12px;color:var(--muted);line-height:1.6;}
.mode-helper{font-size:12px;color:var(--muted);line-height:1.6;font-style:italic;}

/* FORM CARDS */
.step-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px 28px;margin-bottom:12px;}
.step-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.step-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);line-height:1;flex-shrink:0;}
.step-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text);letter-spacing:1px;}
.step-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.form-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:block;}
.opt-tag{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);opacity:0.45;margin-left:6px;text-transform:uppercase;}
.form-inp{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);width:100%;outline:none;transition:border-color 0.2s;margin-bottom:14px;}
.form-inp:focus{border-color:var(--gold);}
.form-inp::placeholder{color:var(--muted);}
.form-select{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 16px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--muted);width:100%;outline:none;cursor:pointer;transition:border-color 0.2s;margin-bottom:14px;}
.form-select:focus{border-color:var(--gold);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.chip{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:7px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.18s;}
.chip:hover{border-color:rgba(240,165,0,0.4);color:var(--gold);}
.chip.sel{background:rgba(240,165,0,0.1);border-color:var(--gold);color:var(--gold);}

/* RESUME DROP */
input[type=file]#pivotFile{display:none;}
.drop-zone{border:1.5px dashed rgba(240,165,0,0.28);border-radius:10px;padding:22px;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(240,165,0,0.02);display:block;margin-bottom:12px;}
.drop-zone:hover,.drop-zone.over{border-color:var(--gold);background:rgba(240,165,0,0.05);}
.drop-zone-icon{font-size:24px;margin-bottom:8px;}
.drop-zone-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:1px;margin-bottom:5px;}
.drop-zone-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
.drop-zone-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:7px 16px;border-radius:5px;border:1px solid rgba(240,165,0,0.35);color:var(--gold);background:transparent;display:inline-block;}
.drop-privacy{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);opacity:0.4;margin-top:8px;}
.drop-status{display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:7px;margin-bottom:10px;font-size:12px;}
.drop-status.show{display:flex;}
.drop-status.ok{background:rgba(46,213,115,0.07);border:1px solid rgba(46,213,115,0.2);color:var(--green);}
.drop-status.warn{background:rgba(255,211,42,0.07);border:1px solid rgba(255,211,42,0.2);color:var(--yellow);}
.drop-status.loading{background:rgba(240,165,0,0.06);border:1px solid rgba(240,165,0,0.15);color:var(--gold);}
.drop-spin{width:13px;height:13px;border:1.5px solid rgba(240,165,0,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.75s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.or-divider{display:flex;align-items:center;gap:10px;margin:10px 0 14px;}
.or-line{flex:1;height:1px;background:var(--border);}
.or-text{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);opacity:0.45;}
.form-textarea{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);width:100%;outline:none;transition:border-color 0.2s;resize:vertical;min-height:120px;line-height:1.65;margin-bottom:14px;}
.form-textarea:focus{border-color:var(--gold);}
.form-textarea::placeholder{color:var(--muted);}
.slider-row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.slider-lbl{font-size:13px;color:var(--muted);flex:1;}
.slider{flex:2;accent-color:var(--gold);cursor:pointer;}
.slider-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);min-width:110px;text-align:right;}

/* CONDITIONAL FIELDS */
.cm-fields,.lp-fields{display:none;}
.cm-fields.show,.lp-fields.show{display:block;}

/* BUILD BTN */
.build-btn{background:var(--gold);color:#000;border:none;border-radius:8px;padding:16px 40px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;cursor:pointer;width:100%;transition:background 0.2s,transform 0.1s;margin-top:8px;}
.build-btn:hover{background:#FFB800;}
.build-btn:active{transform:scale(0.99);}
.build-btn:disabled{background:#333;color:#666;cursor:not-allowed;}
.helper-text{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:1px;line-height:1.6;}

/* ERROR + LOADING */
.error-box{display:none;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.25);border-radius:10px;padding:14px 18px;color:#FF7785;font-size:13px;margin-bottom:16px;}
.error-box.show{display:block;}
.loading-box{display:none;text-align:center;padding:64px 20px;}
.loading-box.show{display:block;}
.spin-wrap{display:inline-block;position:relative;width:52px;height:52px;margin-bottom:18px;}
.spin-wrap::before{content:'';position:absolute;inset:0;border:2px solid rgba(240,165,0,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.75s linear infinite;}
.spin-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.loading-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:6px;}
.loading-sub{font-size:12px;color:var(--muted);}

/* RESULTS */
.results-box{display:none;}
.results-box.show{display:block;}
.results-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;margin-top:40px;}
.results-heading{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,44px);color:var(--text);letter-spacing:1px;line-height:1;margin-bottom:10px;}
.results-summary{font-size:14px;color:var(--muted);line-height:1.75;max-width:640px;padding:14px 18px;border-left:3px solid var(--gold);background:rgba(240,165,0,0.04);border-radius:0 8px 8px 0;margin-bottom:8px;}
.sec-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;opacity:0.8;margin-top:36px;}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,3vw,32px);color:var(--text);letter-spacing:1px;margin-bottom:10px;}
.sec-sub{font-size:13px;color:var(--muted);line-height:1.7;max-width:580px;margin-bottom:20px;}

/* STRENGTH TAGS */
.tag-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.tag-green{background:rgba(46,213,115,0.08);border:1px solid rgba(46,213,115,0.2);border-radius:6px;padding:5px 12px;font-size:12px;color:var(--green);font-family:'DM Mono',monospace;}

/* ROLE CARDS */
.roles-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.roles-grid{grid-template-columns:1fr;}}
.role-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;transition:border-color 0.18s;}
.role-card:hover{border-color:rgba(240,165,0,0.3);}
.role-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);letter-spacing:1px;margin-bottom:4px;}
.role-why{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px;}
.role-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.meta-item{background:var(--panel2);border-radius:6px;padding:7px 10px;}
.meta-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.meta-val{font-size:12px;color:var(--text);font-weight:500;}
.fit-high{color:var(--green);}
.fit-med{color:var(--yellow);}
.fit-long{color:var(--muted);}
.role-titles-wrap{margin-top:8px;}
.role-titles-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.role-title-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);background:rgba(240,165,0,0.06);border:1px solid rgba(240,165,0,0.15);border-radius:4px;padding:3px 9px;display:inline-block;margin:2px;}

/* LEARNING CARDS */
.learning-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:640px){.learning-grid{grid-template-columns:1fr;}}
@media(min-width:641px) and (max-width:840px){.learning-grid{grid-template-columns:1fr 1fr;}}
.learn-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;}
.learn-card-free{border-top:3px solid var(--green);}
.learn-card-cert{border-top:3px solid var(--yellow);}
.learn-card-deg{border-top:3px solid var(--blue);}
.learn-tier{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-weight:700;}
.learn-card-free .learn-tier{color:var(--green);}
.learn-card-cert .learn-tier{color:var(--yellow);}
.learn-card-deg .learn-tier{color:var(--blue);}
.learn-item{font-size:13px;color:var(--text);margin-bottom:5px;padding-left:14px;position:relative;line-height:1.5;}
.learn-item::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;}
.learn-card-free .learn-item::before{background:var(--green);}
.learn-card-cert .learn-item::before{background:var(--yellow);}
.learn-card-deg .learn-item::before{background:var(--blue);}
.learn-detail{font-size:11px;color:var(--muted);padding-left:14px;margin-bottom:7px;}
.learn-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.learn-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.learn-cost-free{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:var(--green);}
.learn-cost-cert{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:var(--yellow);}
.learn-cost-deg{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:var(--blue);}

/* TIMELINE */
.timeline-wrap{position:relative;padding-left:26px;}
.timeline-wrap::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,var(--gold),rgba(240,165,0,0.1));border-radius:2px;}
.tl-item{position:relative;margin-bottom:24px;}
.tl-dot{position:absolute;left:-23px;top:6px;width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);background:var(--dark);}
.tl-dot.active{background:var(--gold);}
.tl-period{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.tl-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.tl-heading{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text);letter-spacing:1px;margin-bottom:5px;}
.tl-body{font-size:13px;color:var(--muted);line-height:1.65;}

/* INSIGHT */
.insight-card{background:var(--panel);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;padding:20px 24px;margin-bottom:24px;}
.insight-text{font-size:14px;color:var(--text);line-height:1.8;font-weight:300;}

/* SWITCH MODE */
.switch-mode-card{background:rgba(46,213,115,0.04);border:1px solid rgba(46,213,115,0.2);border-radius:12px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.switch-mode-text{font-size:13px;color:var(--text);line-height:1.6;}
.switch-mode-text strong{color:var(--green);}
.switch-mode-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:9px 18px;border-radius:6px;border:1px solid rgba(46,213,115,0.35);color:var(--green);background:transparent;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.switch-mode-btn:hover{background:rgba(46,213,115,0.1);}

/* MARKET SIGNAL */
.market-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:12px;}

/* CROSS NAV */
.cross-nav{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-top:40px;}
.cross-nav-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.cross-nav-links{display:flex;gap:10px;flex-wrap:wrap;}
.cross-nav-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);text-decoration:none;padding:8px 16px;border:1px solid rgba(240,165,0,0.3);border-radius:6px;transition:all 0.2s;}
.cross-nav-links a:hover{background:rgba(240,165,0,0.08);}

.footer{border-top:1px solid var(--border);padding:28px 40px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-top:64px;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:2px;}
.footer-copy{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);opacity:0.4;margin-top:4px;}
.footer-links{display:flex;gap:16px;flex-wrap:wrap;}
.footer-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);text-decoration:none;text-transform:uppercase;}
.footer-links a:hover{color:var(--gold);}
.footer-related-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);opacity:0.45;margin-bottom:6px;}

/* PAGE DISCLAIMER */
.page-disclaimer { border-top: 1px solid rgba(240,165,0,0.1); margin-top: 48px; padding: 20px 28px 28px; }
.page-disclaimer-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-disclaimer-text { font-family: 'DM Mono', monospace; font-size: 10px; color: #555566; line-height: 1.7; letter-spacing: 0.5px; flex: 1; min-width: 200px; }
.page-disclaimer-link { font-family: 'DM Mono', monospace; font-size: 10px; color: #F0A500; text-decoration: none; white-space: nowrap; letter-spacing: 0.5px; flex-shrink: 0; }
.page-disclaimer-link:hover { text-decoration: underline; }
@media (max-width: 520px) { .page-disclaimer-inner { flex-direction: column; gap: 8px; } }
@media print { .page-disclaimer { text-align: center; border-top: 1px solid #ccc; padding: 12px 0; } .page-disclaimer-inner { justify-content: center; flex-direction: column; gap: 4px; } }

/* CA IMPORT CARD */
.import-card{background:rgba(46,213,115,0.06);border:1px solid rgba(46,213,115,0.25);border-radius:12px;padding:20px 22px;margin-bottom:16px;}
.import-card-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
.import-card-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text);letter-spacing:1px;margin-bottom:8px;}
.import-card-body{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px;}
.import-detail{background:var(--dark);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
.import-detail-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--green);opacity:0.7;margin-bottom:5px;}
.import-detail-value{font-size:12px;color:var(--text);line-height:1.6;}
.import-role-list{display:flex;flex-direction:column;gap:4px;}
.import-role-item{font-size:12px;color:var(--text);display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.import-role-item:last-child{border-bottom:none;}
.import-role-hrs{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.import-actions{display:flex;gap:10px;flex-wrap:wrap;}
.import-action-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px;border-radius:6px;border:1px solid;cursor:pointer;background:transparent;transition:all 0.2s;}
.import-edit-btn{color:var(--green);border-color:rgba(46,213,115,0.35);}
.import-edit-btn:hover{background:rgba(46,213,115,0.08);}
.import-clear-btn{color:var(--muted);border-color:var(--border);}
.import-clear-btn:hover{color:var(--red);border-color:rgba(255,71,87,0.4);}
.partial-import-card{background:rgba(240,165,0,0.05);border:1px solid rgba(240,165,0,0.2);border-radius:10px;padding:14px 18px;margin-bottom:14px;}

/* CAREER PROFILE MODULE */
.cp-module{margin-top:16px;}
.cp-module-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;opacity:0.8;}
.cp-entry{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.cp-entry-top{display:grid;grid-template-columns:1fr 80px 36px;gap:8px;align-items:center;margin-bottom:12px;}
.cp-title-input{background:#050505;border:1px solid var(--border);border-radius:7px;padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);width:100%;outline:none;transition:border-color 0.2s;}
.cp-title-input:focus{border-color:var(--gold);}
.cp-title-input::placeholder{color:var(--muted);}
.cp-years-input{background:#050505;border:1px solid var(--border);border-radius:7px;padding:10px 8px;font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);width:100%;outline:none;text-align:center;}
.cp-years-input:focus{border-color:var(--gold);}
.cp-remove-btn{background:rgba(255,71,87,0.06);border:1px solid rgba(255,71,87,0.2);border-radius:6px;color:var(--red);width:34px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
.cp-remove-btn:hover{background:rgba(255,71,87,0.18);}
.cp-entry-body{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:560px){.cp-entry-body{grid-template-columns:1fr;}}
.cp-field-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.cp-days-row{display:flex;gap:4px;flex-wrap:wrap;}
.cp-day-btn{padding:5px 7px;border-radius:5px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:#050505;transition:all 0.12s;}
.cp-day-btn.active{background:rgba(240,165,0,0.12);border-color:var(--gold);color:var(--gold);}
.cp-hours-row{display:flex;align-items:center;gap:8px;}
.cp-hrs-slider{flex:1;accent-color:var(--gold);cursor:pointer;}
.cp-hrs-display{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);white-space:nowrap;min-width:60px;}
.cp-badge{display:flex;align-items:center;gap:8px;background:rgba(240,165,0,0.06);border-radius:6px;padding:6px 10px;font-size:11px;}
.cp-badge-hrs{font-family:'DM Mono',monospace;color:var(--gold);font-weight:600;}
.cp-badge-level{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:4px;}
.cp-add-btn{background:none;border:1px dashed rgba(240,165,0,0.3);border-radius:7px;color:var(--gold);padding:10px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;width:100%;margin-top:4px;transition:all 0.2s;}
.cp-add-btn:hover{background:rgba(240,165,0,0.06);border-color:var(--gold);}
.cp-summary{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:8px;padding:6px 10px;background:var(--dark);border-radius:6px;opacity:0.7;}
.limited-warning{background:rgba(240,165,0,0.06);border:1px solid rgba(240,165,0,0.25);border-radius:10px;padding:16px 18px;margin-bottom:14px;display:none;}
.limited-warning-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);margin-bottom:6px;}
.limited-warning-text{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px;}
.lw-btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.lw-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px;border-radius:6px;border:1px solid;cursor:pointer;background:transparent;transition:all 0.2s;}
.lw-continue{color:var(--gold);border-color:rgba(240,165,0,0.35);}
.lw-continue:hover{background:rgba(240,165,0,0.08);}
.lw-add{color:var(--green);border-color:rgba(46,213,115,0.35);}
.lw-add:hover{background:rgba(46,213,115,0.08);}
</style>
