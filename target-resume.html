<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico?v=2">
<title>Resume Studio - Landor's Curve</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--gold:#F0A500;--dark:#050505;--panel:#0f0f0f;--panel2:#161616;--border:rgba(240,165,0,0.12);--text:#E8E8F0;--muted:#888899;--red:#FF4757;--orange:#FF6B35;--yellow:#FFD32A;--green:#2ED573;--blue:#1E90FF;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.nav{position:sticky;top:0;z-index:100;background:rgba(5,5,5,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;text-decoration:none;display:flex;align-items:center;gap:8px;}
.nav-logo img{width:22px;height:22px;border-radius:4px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:4px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown{position:relative;}
.nav-dropdown-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:4px;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.nav-dropdown-btn:hover,.nav-dropdown.open .nav-dropdown-btn{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown-btn svg{width:10px;height:10px;transition:transform 0.2s;}
.nav-dropdown.open .nav-dropdown-btn svg{transform:rotate(180deg);}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:200px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200;}
.nav-dropdown.open .nav-dropdown-menu{display:block;}
.nav-dropdown-menu a{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 16px;transition:all 0.15s;border-bottom:1px solid var(--border);}
.nav-dropdown-menu a:last-child{border-bottom:none;}
.nav-dropdown-menu a:hover{color:var(--gold);background:rgba(240,165,0,0.06);}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--gold);align-items:center;}
.nav-hamburger svg{width:22px;height:22px;}
.mobile-menu{display:none;position:fixed;inset:0;z-index:999;}
.mobile-menu.open{display:block;}
.mobile-menu-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);}
.mobile-menu-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.mobile-menu-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.mobile-menu-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;text-decoration:none;}
.mobile-menu-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:0;}
.mobile-menu-close:hover{color:var(--gold);}
.mobile-menu a{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:14px 20px;border-bottom:1px solid rgba(240,165,0,0.06);transition:all 0.15s;}
.mobile-menu a:hover{color:var(--gold);}
.mobile-menu-section{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0.4;padding:12px 20px 4px;}
.mobile-menu a.sub{padding-left:32px;font-size:10px;}
@media(max-width:720px){.nav-links{display:none;}.nav-hamburger{display:flex;}}
.wrap{max-width:960px;margin:0 auto;padding:0 28px;}
.divider-line{border:none;border-top:1px solid var(--border);margin:40px 0;}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:16px;opacity:0.8;}
/* HERO */
.hero{padding:72px 0 40px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,9vw,88px);line-height:0.88;color:var(--text);letter-spacing:2px;margin-bottom:12px;}
.hero-title span{color:var(--gold);}
.hero-tagline{font-size:17px;color:var(--text);line-height:1.6;max-width:560px;margin-bottom:10px;font-weight:300;}
.hero-sub{font-size:14px;color:var(--muted);line-height:1.75;max-width:620px;margin-bottom:10px;}
.hero-note{font-size:13px;color:var(--muted);line-height:1.7;max-width:580px;padding:12px 16px;border-left:2px solid rgba(240,165,0,0.2);margin-top:16px;}
/* MODE SELECTOR */
.mode-section{margin-bottom:20px;}
.mode-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;opacity:0.8;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:680px){.mode-grid{grid-template-columns:1fr;}}
@media(min-width:681px) and (max-width:880px){.mode-grid{grid-template-columns:1fr 1fr;}}
.mode-card{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:18px 20px;cursor:pointer;transition:all 0.2s;}
.mode-card:hover{border-color:rgba(240,165,0,0.35);}
.mode-card.sel-target{border-color:var(--gold);background:rgba(240,165,0,0.05);}
.mode-card.sel-cleanup{border-color:var(--green);background:rgba(46,213,115,0.05);}
.mode-card.sel-future{border-color:var(--blue);background:rgba(30,144,255,0.05);}
.mode-icon{font-size:20px;margin-bottom:8px;}
.mode-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:5px;}
.mode-target .mode-name{color:var(--gold);}
.mode-cleanup .mode-name{color:var(--green);}
.mode-future .mode-name{color:var(--blue);}
.mode-desc{font-size:12px;color:var(--muted);line-height:1.6;}
.mode-beta{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);opacity:0.7;margin-top:6px;}
/* STEP CARDS */
.step-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 30px;margin-bottom:12px;}
.step-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.step-num{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);line-height:1;flex-shrink:0;width:32px;}
.step-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text);letter-spacing:1px;}
.step-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.form-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:block;}
.opt-tag{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);opacity:0.45;margin-left:6px;text-transform:uppercase;}
.form-inp{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 18px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);width:100%;outline:none;transition:border-color 0.2s;margin-bottom:16px;}
.form-inp:focus{border-color:var(--gold);}
.form-inp::placeholder{color:var(--muted);}
.form-textarea{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 18px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);width:100%;outline:none;transition:border-color 0.2s;resize:vertical;min-height:140px;line-height:1.65;margin-bottom:16px;}
.form-textarea:focus{border-color:var(--gold);}
.form-textarea::placeholder{color:var(--muted);}
.form-select{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 18px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--muted);width:100%;outline:none;cursor:pointer;transition:border-color 0.2s;margin-bottom:16px;}
.form-select:focus{border-color:var(--gold);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:580px){.form-grid{grid-template-columns:1fr;}}
/* MODE-SPECIFIC FIELDS */
.mode-fields{display:none;}
.mode-fields.show{display:block;}
/* RESUME DROP */
input[type=file]#resumeFileInput{display:none;}
.drop-zone{border:1.5px dashed rgba(240,165,0,0.3);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(240,165,0,0.02);display:block;margin-bottom:12px;}
.drop-zone:hover,.drop-zone.over{border-color:var(--gold);background:rgba(240,165,0,0.06);}
.drop-zone-icon{font-size:26px;margin-bottom:8px;}
.drop-zone-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:1px;margin-bottom:5px;}
.drop-zone-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
.drop-zone-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:7px 16px;border-radius:5px;border:1px solid rgba(240,165,0,0.35);color:var(--gold);background:transparent;display:inline-block;}
.drop-privacy{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);opacity:0.4;margin-top:8px;}
.drop-status{display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:7px;margin-bottom:10px;font-size:12px;}
.drop-status.show{display:flex;}
.drop-status.ok{background:rgba(46,213,115,0.07);border:1px solid rgba(46,213,115,0.2);color:var(--green);}
.drop-status.warn{background:rgba(255,211,42,0.07);border:1px solid rgba(255,211,42,0.2);color:var(--yellow);}
.drop-status.loading{background:rgba(240,165,0,0.06);border:1px solid rgba(240,165,0,0.15);color:var(--gold);}
.drop-spin{width:13px;height:13px;border:1.5px solid rgba(240,165,0,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.75s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.or-divider{display:flex;align-items:center;gap:10px;margin:8px 0 14px;}
.or-line{flex:1;height:1px;background:var(--border);}
.or-text{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);opacity:0.45;}
/* BUILD BTN */
.build-btn{background:var(--gold);color:#000;border:none;border-radius:8px;padding:17px 40px;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1.5px;cursor:pointer;width:100%;transition:background 0.2s,transform 0.1s;margin-top:4px;}
.build-btn:hover{background:#FFB800;}
.build-btn:active{transform:scale(0.99);}
.build-btn:disabled{background:#333;color:#666;cursor:not-allowed;}
/* LOADING */
.error-box{display:none;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.25);border-radius:10px;padding:14px 18px;color:#FF7785;font-size:13px;margin-bottom:16px;}
.error-box.show{display:block;}
.loading-box{display:none;text-align:center;padding:64px 20px;}
.loading-box.show{display:block;}
.spin-wrap{display:inline-block;position:relative;width:52px;height:52px;margin-bottom:18px;}
.spin-wrap::before{content:'';position:absolute;inset:0;border:2px solid rgba(240,165,0,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.75s linear infinite;}
.spin-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.loading-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:6px;}
.loading-sub{font-size:12px;color:var(--muted);}
/* RESULTS */
.results-box{display:none;}
.results-box.show{display:block;}
.results-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;margin-top:40px;}
.results-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,44px);color:var(--text);letter-spacing:1px;line-height:1;margin-bottom:10px;}
.results-summary{font-size:14px;color:var(--muted);line-height:1.75;max-width:640px;padding:14px 18px;border-left:3px solid var(--gold);background:rgba(240,165,0,0.04);border-radius:0 8px 8px 0;margin-bottom:8px;}
.sec-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;opacity:0.8;}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,3vw,30px);color:var(--text);letter-spacing:1px;margin-bottom:12px;}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.match-tag{background:rgba(46,213,115,0.08);border:1px solid rgba(46,213,115,0.2);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--green);font-family:'DM Mono',monospace;}
.keyword-tag{background:rgba(240,165,0,0.08);border:1px solid rgba(240,165,0,0.2);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--gold);font-family:'DM Mono',monospace;}
.gap-tag{background:rgba(255,107,53,0.08);border:1px solid rgba(255,107,53,0.2);border-radius:6px;padding:6px 14px;font-size:12px;color:var(--orange);font-family:'DM Mono',monospace;}
.reframe-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.reframe-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.reframe-before{font-size:12px;color:var(--muted);margin-bottom:6px;}
.reframe-before span{font-family:'DM Mono',monospace;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.15);border-radius:4px;padding:2px 8px;color:#FF7785;}
.reframe-arrow{font-size:12px;color:var(--muted);margin-bottom:6px;}
.reframe-after span{font-family:'DM Mono',monospace;background:rgba(46,213,115,0.08);border:1px solid rgba(46,213,115,0.15);border-radius:4px;padding:2px 8px;color:var(--green);}
.summary-card{background:var(--panel);border:1px solid rgba(240,165,0,0.2);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;padding:24px 28px;margin-bottom:12px;}
.summary-text{font-size:14px;color:var(--text);line-height:1.85;font-weight:300;}
.resume-output{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 30px;margin-bottom:12px;}
.resume-section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:2px;margin-bottom:8px;margin-top:18px;border-bottom:1px solid var(--border);padding-bottom:6px;}
.resume-section-title:first-child{margin-top:0;}
.resume-content{font-size:13px;color:var(--text);line-height:1.8;white-space:pre-wrap;}
.copy-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:7px 16px;border-radius:6px;border:1px solid rgba(240,165,0,0.3);color:var(--gold);background:transparent;cursor:pointer;transition:all 0.2s;margin-top:16px;}
.copy-btn:hover{background:rgba(240,165,0,0.08);border-color:var(--gold);}
.gap-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.gap-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;gap:12px;}
.gap-icon{font-size:16px;flex-shrink:0;}
.gap-text{font-size:13px;color:var(--muted);line-height:1.6;}
/* DISCLAIMER FOOTER */
.page-disclaimer{border-top:1px solid rgba(240,165,0,0.1);margin-top:48px;padding:20px 28px 28px;}
.page-disclaimer-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.page-disclaimer-text{font-family:'DM Mono',monospace;font-size:10px;color:#555566;line-height:1.7;letter-spacing:0.5px;flex:1;min-width:200px;}
.page-disclaimer-link{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);text-decoration:none;white-space:nowrap;letter-spacing:0.5px;flex-shrink:0;}
@media(max-width:520px){.page-disclaimer-inner{flex-direction:column;gap:8px;}}
/* FOOTER */
.footer{border-top:1px solid var(--border);padding:28px 40px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:2px;}
.footer-copy{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);opacity:0.4;margin-top:4px;}
.footer-links{display:flex;gap:14px;flex-wrap:wrap;}
.footer-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);text-decoration:none;text-transform:uppercase;}
.footer-links a:hover{color:var(--gold);}
.footer-related-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);opacity:0.45;margin-bottom:6px;}
</style>
</head>

      <button class="nav-dropdown-btn" onclick="toggleDropdown()">Tools
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none" style="margin-left:4px;"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="nav-dropdown-menu">
        <a href="/#analyzer">Analyzer</a>

        <div class="nav-dropdown-divider"></div>

    <a href="/pricing">Pricing</a>
    <a href="/sources">Sources</a>
    <a href="/about">About</a>
  </div>

  </button>
</nav>
