<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico?v=2">
<title>Rebound Radar: Landor's Curve</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F0A500;--dark:#050505;--panel:#0f0f0f;--panel2:#161616;
  --border:rgba(240,165,0,0.12);--text:#E8E8F0;--muted:#888899;
  --red:#FF4757;--orange:#FF6B35;--yellow:#FFD32A;--green:#2ED573;--blue:#1E90FF;--purple:#A855F7;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(5,5,5,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;text-decoration:none;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-logo img{width:22px;height:22px;border-radius:4px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:4px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown{position:relative;}
.nav-dropdown-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:4px;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.nav-dropdown-btn:hover,.nav-dropdown.open .nav-dropdown-btn{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown-btn svg{width:10px;height:10px;transition:transform 0.2s;}
.nav-dropdown.open .nav-dropdown-btn svg{transform:rotate(180deg);}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:200px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200;}
.nav-dropdown.open .nav-dropdown-menu{display:block;}
.nav-dropdown-menu a{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 16px;transition:all 0.15s;border-bottom:1px solid var(--border);}
.nav-dropdown-menu a:last-child{border-bottom:none;}
.nav-dropdown-menu a:hover{color:var(--gold);background:rgba(240,165,0,0.06);}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--gold);align-items:center;}
.nav-hamburger svg{width:22px;height:22px;}
.mobile-menu{display:none;position:fixed;inset:0;z-index:999;}
.mobile-menu.open{display:block;}
.mobile-menu-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);}
.mobile-menu-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.mobile-menu-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.mobile-menu-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;text-decoration:none;}
.mobile-menu-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:0;}
.mobile-menu-close:hover{color:var(--gold);}
.mobile-menu a{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:14px 20px;border-bottom:1px solid rgba(240,165,0,0.06);transition:all 0.15s;}
.mobile-menu a:hover{color:var(--gold);}
.mobile-menu-section{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0.4;padding:12px 20px 4px;}
.mobile-menu a.sub{padding-left:32px;font-size:10px;}
@media(max-width:720px){.nav-links{display:none;}.nav-hamburger{display:flex;}}

/* LAYOUT */
.wrap{max-width:960px;margin:0 auto;padding:0 28px;}

/* HERO */
.hero{padding:72px 0 48px;}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--orange);text-transform:uppercase;margin-bottom:16px;opacity:0.9;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,9vw,88px);line-height:0.88;color:var(--text);letter-spacing:2px;margin-bottom:12px;}
.hero-title span{color:var(--orange);}
.hero-tagline{font-size:17px;color:var(--text);line-height:1.6;max-width:560px;margin-bottom:10px;font-weight:300;}
.hero-sub{font-size:14px;color:var(--muted);line-height:1.75;max-width:580px;margin-bottom:6px;}
.hero-disclaimer{font-size:12px;color:var(--muted);opacity:0.55;line-height:1.7;max-width:580px;padding:12px 16px;border-left:2px solid rgba(255,107,53,0.3);margin-top:16px;font-style:italic;}

/* INPUT FORM */
.form-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;margin-bottom:16px;}
.form-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:block;}
.form-inp{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:13px 18px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);width:100%;outline:none;transition:border-color 0.2s;margin-bottom:20px;}
.form-inp:focus{border-color:var(--gold);}
.form-inp::placeholder{color:var(--muted);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:580px){.form-grid{grid-template-columns:1fr;}}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.chip{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.18s;}
.chip:hover{border-color:rgba(240,165,0,0.4);color:var(--gold);}
.chip.selected{background:rgba(240,165,0,0.1);border-color:var(--gold);color:var(--gold);}
.chip-orange.selected{background:rgba(255,107,53,0.1);border-color:var(--orange);color:var(--orange);}

.build-btn{background:var(--orange);color:#000;border:none;border-radius:8px;padding:16px 40px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;cursor:pointer;width:100%;transition:background 0.2s,transform 0.1s;margin-top:8px;}
.build-btn:hover{background:#FF8050;}
.build-btn:active{transform:scale(0.99);}
.build-btn:disabled{background:#333;color:#666;cursor:not-allowed;}
.helper-text{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin-top:12px;letter-spacing:1px;line-height:1.6;}

/* ERROR + LOADING */
.error-box{display:none;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.25);border-radius:10px;padding:16px 20px;color:#FF7785;font-size:13px;margin-bottom:20px;}
.error-box.show{display:block;}
.loading-box{display:none;text-align:center;padding:72px 20px;}
.loading-box.show{display:block;}
.spin-wrap{display:inline-block;position:relative;width:56px;height:56px;margin-bottom:22px;}
.spin-wrap::before{content:'';position:absolute;inset:0;border:2px solid rgba(255,107,53,0.2);border-top-color:var(--orange);border-radius:50%;animation:spin 0.75s linear infinite;}
.spin-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-title{font-family:'DM Mono',monospace;font-size:12px;color:var(--orange);letter-spacing:2px;margin-bottom:8px;}
.loading-sub{font-size:12px;color:var(--muted);}

/* RESULTS */
.results-box{display:none;}
.results-box.show{display:block;}
.results-intro{padding:36px 0 8px;}
.results-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.results-heading{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,44px);color:var(--text);letter-spacing:1px;line-height:1;margin-bottom:10px;}
.results-summary{font-size:14px;color:var(--muted);line-height:1.75;max-width:640px;padding:14px 18px;border-left:3px solid var(--orange);background:rgba(255,107,53,0.04);border-radius:0 8px 8px 0;margin-bottom:8px;}
.divider-line{border:none;border-top:1px solid var(--border);margin:40px 0;}

/* SECTION LABEL */
.sec-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--orange);margin-bottom:10px;opacity:0.8;}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,3.5vw,34px);color:var(--text);letter-spacing:1px;margin-bottom:8px;}
.sec-sub{font-size:13px;color:var(--muted);line-height:1.7;max-width:580px;margin-bottom:24px;}

/* OPPORTUNITY ZONE CARDS */
.zones-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.zones-grid{grid-template-columns:1fr;}}
.zone-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;transition:border-color 0.18s;}
.zone-card:hover{border-color:rgba(255,107,53,0.35);}
.zone-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);letter-spacing:1px;margin-bottom:6px;}
.zone-desc{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:12px;}
.zone-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.durability-pill{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid;}
.pill-bridge{color:var(--yellow);border-color:rgba(255,211,42,0.3);background:rgba(255,211,42,0.06);}
.pill-medium{color:var(--blue);border-color:rgba(30,144,255,0.3);background:rgba(30,144,255,0.06);}
.pill-durable-skill{color:var(--green);border-color:rgba(46,213,115,0.3);background:rgba(46,213,115,0.06);}
.pill-durable-role{color:var(--orange);border-color:rgba(255,107,53,0.3);background:rgba(255,107,53,0.06);}
.zone-category{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);opacity:0.6;text-transform:uppercase;}

/* LEARN CARDS */
.learn-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:640px){.learn-grid{grid-template-columns:1fr;}}
@media(min-width:641px) and (max-width:840px){.learn-grid{grid-template-columns:1fr 1fr;}}
.learn-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.learn-card-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--orange);letter-spacing:1px;margin-bottom:6px;}
.learn-card-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;}
.learn-pill{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 9px;border-radius:4px;display:inline-block;}

/* WHY NOW */
.why-card{background:var(--panel);border:1px solid rgba(255,107,53,0.2);border-radius:14px;padding:24px 28px;margin-bottom:14px;}
.why-text{font-size:14px;color:var(--text);line-height:1.8;font-weight:300;}

/* FIRST STEPS */
.steps-list{display:flex;flex-direction:column;gap:10px;}
.step-item{display:flex;align-items:flex-start;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.step-num{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--orange);line-height:1;flex-shrink:0;width:24px;}
.step-text{font-size:13px;color:var(--text);line-height:1.6;}
.step-note{font-size:11px;color:var(--muted);margin-top:3px;}

/* INSIGHT */
.insight-card{background:var(--panel);border-left:4px solid var(--orange);border-radius:0 14px 14px 0;padding:22px 26px;margin-bottom:28px;}
.insight-text{font-size:14px;color:var(--text);line-height:1.8;font-weight:300;}

/* CROSS NAV */
.cross-nav{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-top:40px;}
.cross-nav-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.cross-nav-links{display:flex;gap:10px;flex-wrap:wrap;}
.cross-nav-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);text-decoration:none;padding:8px 16px;border:1px solid rgba(240,165,0,0.3);border-radius:6px;transition:all 0.2s;}
.cross-nav-links a:hover{background:rgba(240,165,0,0.08);}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:28px 40px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-top:64px;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:2px;}
.footer-copy{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);opacity:0.4;margin-top:4px;}
.footer-links{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.footer-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);text-decoration:none;text-transform:uppercase;}
.footer-links a:hover{color:var(--gold);}
.footer-related-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);opacity:0.45;margin-bottom:6px;}

/* MINI RESUME DROP */
.resume-mini-wrap{margin-bottom:14px;}
.resume-mini-zone{border:1px dashed rgba(240,165,0,0.25);border-radius:10px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;transition:all 0.2s;background:rgba(240,165,0,0.02);}
.resume-mini-zone:hover{border-color:rgba(240,165,0,0.5);background:rgba(240,165,0,0.05);}
.resume-mini-left{display:flex;align-items:center;gap:12px;}
.resume-mini-icon{font-size:18px;opacity:0.7;}
.resume-mini-text{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.resume-mini-sub{font-size:11px;color:var(--muted);opacity:0.5;margin-top:2px;}
.resume-mini-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border-radius:5px;border:1px solid rgba(240,165,0,0.3);color:var(--gold);background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.2s;}
.resume-mini-btn:hover{background:rgba(240,165,0,0.08);border-color:var(--gold);}
input[type=file].resume-mini-input{display:none;}
.resume-mini-status{display:none;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;margin-top:8px;font-size:12px;}
.resume-mini-status.show{display:flex;}
.resume-mini-status.ok{background:rgba(46,213,115,0.07);border:1px solid rgba(46,213,115,0.2);color:var(--green);}
.resume-mini-status.warn{background:rgba(255,211,42,0.07);border:1px solid rgba(255,211,42,0.2);color:var(--yellow);}
.resume-mini-status.loading{background:rgba(240,165,0,0.06);border:1px solid rgba(240,165,0,0.15);color:var(--gold);}
.resume-mini-spin{width:14px;height:14px;border:1.5px solid rgba(240,165,0,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.75s linear infinite;flex-shrink:0;}


/* PAGE DISCLAIMER */
.page-disclaimer { border-top: 1px solid rgba(240,165,0,0.1); margin-top: 48px; padding: 20px 28px 28px; }
.page-disclaimer-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-disclaimer-text { font-family: 'DM Mono', monospace; font-size: 10px; color: #555566; line-height: 1.7; letter-spacing: 0.5px; flex: 1; min-width: 200px; }
.page-disclaimer-link { font-family: 'DM Mono', monospace; font-size: 10px; color: #F0A500; text-decoration: none; white-space: nowrap; letter-spacing: 0.5px; flex-shrink: 0; }
.page-disclaimer-link:hover { text-decoration: underline; }
@media (max-width: 520px) { .page-disclaimer-inner { flex-direction: column; gap: 8px; } }
@media print { .page-disclaimer { text-align: center; border-top: 1px solid #ccc; padding: 12px 0; } .page-disclaimer-inner { justify-content: center; flex-direction: column; gap: 4px; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
