<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico?v=2">
<title>Military-to-Civilian Pathways - Landor's Curve</title>
<meta name="description" content="Translate military experience into civilian career opportunities using O*NET, BLS, military occupation crosswalks, and AI-assisted career analysis.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#F0A500;--dark:#050505;--panel:#111118;--panel2:#16161F;--border:rgba(240,165,0,0.15);--text:#E8E8F0;--muted:#888899;--red:#FF4757;--orange:#FF6B35;--yellow:#FFD32A;--green:#2ED573;--blue:#1E90FF;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{background:#050505;color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;text-decoration:none;display:flex;align-items:center;gap:8px;}
.nav-logo img{width:22px;height:22px;border-radius:4px;}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-links a{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:4px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown{position:relative;}
.nav-dropdown-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:4px;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.nav-dropdown-btn:hover,.nav-dropdown.open .nav-dropdown-btn{color:var(--gold);background:rgba(240,165,0,0.08);}
.nav-dropdown-btn svg{width:10px;height:10px;transition:transform 0.2s;}
.nav-dropdown.open .nav-dropdown-btn svg{transform:rotate(180deg);}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:210px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200;}
.nav-dropdown.open .nav-dropdown-menu{display:block;}
.nav-dropdown-menu a{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 16px;transition:all 0.15s;border-bottom:1px solid var(--border);}
.nav-dropdown-menu a:last-child{border-bottom:none;}
.nav-dropdown-menu a:hover{color:var(--gold);background:rgba(240,165,0,0.06);}
.nav-dropdown-divider{border-top:1px solid var(--border);margin:4px 0;}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--gold);align-items:center;}
.nav-hamburger svg{width:22px;height:22px;}
.mobile-menu{display:none;position:fixed;inset:0;z-index:999;}
.mobile-menu.open{display:block;}
.mobile-menu-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);}
.mobile-menu-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.mobile-menu-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.mobile-menu-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px;text-decoration:none;}
.mobile-menu-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;line-height:1;padding:0;}
.mobile-menu a{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:14px 20px;border-bottom:1px solid rgba(240,165,0,0.06);transition:all 0.15s;}
.mobile-menu a:hover{color:var(--gold);}
.mobile-menu a.sub{padding-left:32px;font-size:10px;}
.mobile-menu-section-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0.4;padding:12px 20px 4px;}
@media(max-width:720px){.nav-links{display:none;}.nav-hamburger{display:flex;}}

/* LAYOUT */
.wrap{max-width:960px;margin:0 auto;padding:0 28px;}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;opacity:0.8;}
.section-heading{font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,3.5vw,38px);color:var(--text);letter-spacing:1px;margin-bottom:10px;line-height:1;}
.divider{border:none;border-top:1px solid var(--border);margin:0;}

/* HERO */
.hero{padding:72px 0 52px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(38px,6vw,68px);color:var(--text);letter-spacing:2px;line-height:0.95;margin-bottom:16px;}
.hero-title span{color:var(--gold);}
.hero-sub{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;color:var(--muted);margin-bottom:22px;line-height:1.7;max-width:620px;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;}
.btn-primary{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:12px 24px;border-radius:8px;background:var(--gold);color:#000;border:none;cursor:pointer;font-weight:600;transition:opacity 0.2s;text-decoration:none;display:inline-block;}
.btn-primary:hover{opacity:0.85;}
.btn-secondary{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:12px 24px;border-radius:8px;background:transparent;color:var(--gold);border:1px solid rgba(240,165,0,0.35);cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
.btn-secondary:hover{background:rgba(240,165,0,0.06);}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px;}
@media(max-width:640px){.stats-row{grid-template-columns:1fr 1fr;}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold);letter-spacing:1px;line-height:1;}
.stat-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:4px;line-height:1.4;}

/* INPUT FORM */
.form-section{padding:52px 0;}
.form-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px 36px;}
@media(max-width:600px){.form-card{padding:22px 18px;}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.form-inp,.form-select,.form-textarea{background:#0a0a12;border:1px solid rgba(240,165,0,0.18);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;outline:none;transition:border-color 0.2s;}
.form-inp:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(240,165,0,0.5);}
.form-select option{background:#0a0a12;}
.form-textarea{resize:vertical;min-height:100px;line-height:1.6;}
.form-hint{font-size:11px;color:var(--muted);opacity:0.6;margin-top:2px;}
.code-type-badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;padding:3px 8px;border-radius:4px;background:rgba(240,165,0,0.08);border:1px solid rgba(240,165,0,0.2);color:var(--gold);display:inline-block;margin-top:4px;}
.or-divider{text-align:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);opacity:0.4;padding:12px 0;}

/* DROP ZONE */
.drop-zone{border:2px dashed rgba(240,165,0,0.2);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(240,165,0,0.02);}
.drop-zone:hover,.drop-zone.drag-over{border-color:rgba(240,165,0,0.5);background:rgba(240,165,0,0.04);}
.drop-zone-text{font-size:13px;color:var(--muted);margin-bottom:8px;}
.drop-zone-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:7px 16px;border-radius:6px;border:1px solid rgba(240,165,0,0.3);color:var(--gold);background:transparent;cursor:pointer;}

/* LOADING */
.load-box{display:none;text-align:center;padding:40px 0;}
.load-box.show{display:block;}
.load-spinner{width:36px;height:36px;border:3px solid rgba(240,165,0,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-msg{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--muted);}

/* ERROR */
.err-box{display:none;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.25);border-radius:8px;padding:12px 16px;font-size:13px;color:#FF4757;margin-bottom:16px;}
.err-box.show{display:block;}

/* RESULTS */
.results-area{display:none;padding:52px 0;}
.results-area.show{display:block;}
.result-headline{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,44px);color:var(--text);letter-spacing:1px;margin-bottom:6px;line-height:1;}
.result-summary{font-size:14px;color:var(--muted);line-height:1.75;max-width:680px;margin-bottom:32px;}

/* MATCH CARDS */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
@media(max-width:580px){.match-grid{grid-template-columns:1fr;}}
.match-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;position:relative;}
.match-badge{position:absolute;top:16px;right:16px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:4px;}
.badge-high{background:rgba(46,213,115,0.1);color:var(--green);border:1px solid rgba(46,213,115,0.25);}
.badge-med-high{background:rgba(240,165,0,0.08);color:var(--gold);border:1px solid rgba(240,165,0,0.2);}
.badge-med{background:rgba(30,144,255,0.08);color:var(--blue);border:1px solid rgba(30,144,255,0.2);}
.match-soc{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);margin-bottom:4px;opacity:0.6;}
.match-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);letter-spacing:1px;margin-bottom:8px;padding-right:80px;}
.match-why{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:14px;}
.match-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding-top:12px;border-top:1px solid var(--border);}
.match-stat-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);opacity:0.5;margin-bottom:2px;}
.match-stat-val{font-size:13px;color:var(--text);font-weight:500;}
.future-score{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;}
.score-hi{color:var(--green);}
.score-med{color:var(--gold);}
.score-lo{color:var(--red);}

/* SKILLS / GAPS / STEPS */
.tags-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.skill-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;border-radius:5px;background:rgba(240,165,0,0.06);border:1px solid rgba(240,165,0,0.15);color:var(--muted);}
.gap-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;}
.gap-name{font-size:14px;color:var(--text);font-weight:500;margin-bottom:6px;}
.gap-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.gap-pill{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;padding:2px 8px;border-radius:3px;}
.pill-high{background:rgba(255,71,87,0.08);color:var(--red);border:1px solid rgba(255,71,87,0.2);}
.pill-med{background:rgba(240,165,0,0.08);color:var(--gold);border:1px solid rgba(240,165,0,0.2);}
.pill-low{background:rgba(136,136,153,0.08);color:var(--muted);border:1px solid rgba(136,136,153,0.2);}
.gap-why{font-size:12px;color:var(--muted);line-height:1.6;}
.gap-detail{font-size:11px;color:var(--muted);opacity:0.65;margin-top:4px;}
.resume-suggestion{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;font-size:13px;color:var(--muted);line-height:1.65;}
.resume-suggestion strong{color:var(--text);}
.step-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(240,165,0,0.06);}
.step-item:last-child{border-bottom:none;}
.step-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);flex-shrink:0;margin-top:1px;opacity:0.7;}
.step-text{font-size:13px;color:var(--text);line-height:1.65;}
.future-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;}
.future-title{font-size:15px;color:var(--text);font-weight:500;margin-bottom:6px;}
.future-rationale{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px;}

/* SECTION CARDS */
.result-section{margin-bottom:36px;}
.result-section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.result-section-icon{font-size:18px;}
.result-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 24px;}

/* RESUME STUDIO HANDOFF */
.handoff-card{background:rgba(240,165,0,0.04);border:1px solid rgba(240,165,0,0.2);border-radius:14px;padding:24px 28px;margin-top:32px;}
.handoff-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.handoff-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--text);letter-spacing:1px;margin-bottom:8px;}
.handoff-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
.handoff-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

/* CODE EXPLORER */
.explorer-section{padding:52px 0;}
.code-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
@media(max-width:640px){.code-grid{grid-template-columns:1fr 1fr;}}
.code-chip{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all 0.18s;}
.code-chip:hover{border-color:rgba(240,165,0,0.35);background:rgba(240,165,0,0.04);}
.code-chip.selected{border-color:var(--gold);background:rgba(240,165,0,0.07);}
.chip-code{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);margin-bottom:2px;}
.chip-title{font-size:11px;color:var(--muted);line-height:1.4;}
.chip-branch{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);opacity:0.5;margin-top:2px;}

/* SOURCES */
.sources-section{background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:40px 0;margin-top:52px;}
.sources-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px;}
@media(max-width:620px){.sources-grid{grid-template-columns:1fr 1fr;}}
.source-badge{background:rgba(240,165,0,0.04);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;}
.source-name{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:2px;}
.source-desc{font-size:10px;color:var(--muted);}

/* FOOTER */
.page-disclaimer{border-top:1px solid rgba(240,165,0,0.1);padding:20px 28px 28px;}
.page-disclaimer-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.page-disclaimer-text{font-family:'DM Mono',monospace;font-size:10px;color:#555566;line-height:1.7;letter-spacing:0.5px;flex:1;min-width:200px;}
.page-disclaimer-link{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);text-decoration:none;}
@media(max-width:680px){.handoff-grid-3{grid-template-columns:1fr !important;}}
</style>
</head>
